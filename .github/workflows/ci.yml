name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Test CLI on example
        run: |
          node dist/cli.js scan --root examples/nextjs-app/src --output test-atlas.json
          test -f test-atlas.json || exit 1
          node dist/cli.js check examples/nextjs-app/src/components/Button.tsx --manifest test-atlas.json || true

  example-app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build component-atlas
        run: npm run build

      - name: Install example app dependencies
        working-directory: examples/nextjs-app
        run: npm install

      - name: Build example app
        working-directory: examples/nextjs-app
        run: npm run build
